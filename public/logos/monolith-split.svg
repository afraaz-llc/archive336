<?xml version="1.0" encoding="UTF-8"?>
<!--
  ARCHIVE336 — "Monolith (split)" variant.
  Same 1:2.4 rectangle with a single 1-unit horizontal seam at 1/6
  from the top. Reads as a transition, a door, a moment frozen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" width="200" height="480">
  <rect width="100" height="240" fill="#000"/>
  <line x1="0" y1="40" x2="100" y2="40" stroke="#fff" stroke-width="1.2"/>
</svg>
